name: Validar y publicar VaXCuenta
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vaxcuenta-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir proyecto
        uses: actions/checkout@v6
      - name: Usar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validar y preparar datos
        run: python3 scripts/build_data.py
      - name: Auditar importación
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Probar aplicación
        run: npm test
      - name: Preparar sitio estático
        run: npm run build
      - name: Verificar archivos de publicación
        run: python3 scripts/verify_release.py
      - name: Guardar sitio para publicación
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Publicar VaXCuenta
        id: deployment
        uses: actions/deploy-pages@v4
